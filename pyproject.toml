[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-ebm"
version = "1.1.0"
description = "PROMETHEUS-EBM: Benchmarking Epistemic Metacognition in AI Models — The Living Benchmark with Anti-Contamination Architecture"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Mushfiqul Alam", email = "mushfiqulalam007@gmail.com"},
]
keywords = [
    "ai", "benchmark", "metacognition", "calibration", "epistemic",
    "llm-evaluation", "agi", "anti-contamination", "living-benchmark",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "requests>=2.28",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.25"]
openai = ["openai>=1.0"]
all = ["anthropic>=0.25", "openai>=1.0"]

[project.scripts]
prometheus-ebm = "prometheus_ebm.__main__:main"

[project.urls]
Homepage = "https://github.com/Mushfiqul-Alam-17/prometheus-ebm-sdk"
Repository = "https://github.com/Mushfiqul-Alam-17/prometheus-ebm-sdk"
Documentation = "https://github.com/Mushfiqul-Alam-17/prometheus-ebm-sdk#readme"
"Bug Tracker" = "https://github.com/Mushfiqul-Alam-17/prometheus-ebm-sdk/issues"
PyPI = "https://pypi.org/project/prometheus-ebm/"

[tool.setuptools.packages.find]
include = ["prometheus_ebm*"]

[tool.setuptools.package-data]
prometheus_ebm = ["data/*.json"]
